<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
  <script src="./clubData.js"></script>
  <script src="./count-up.js"></script>
  <script src="./tkz-anim.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    :root{ --ink:#20291f; --green:#1f6b3a; --green-dk:#123a24; --ball:#cddb46; --clay:#c0562a; --brown:#6e4a30; --cream:#f6f2e9; --muted:#6f675a; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--cream); color:var(--ink); font-family:"Source Sans 3",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    a{ color:var(--green); text-decoration:none; } a:hover{ color:var(--clay); }
    ::selection{ background:var(--ball); color:var(--ink); }
    :focus-visible{ outline:2px solid var(--clay); outline-offset:2px; }
    @media (max-width:880px){ .tkz-foot-grid{ grid-template-columns:1fr !important; } }
    @media (max-width:760px){ .tkz-gal{ grid-template-columns:1fr 1fr !important; grid-auto-rows:180px !important; } .tkz-amen{ grid-template-columns:1fr 1fr !important; } .tkz-story{ grid-template-columns:1fr !important; } }
  </style>
</helmet>
<div>
  <dc-import name="Nav" active="about" hint-size="100%,72px"></dc-import>

  <!-- HERO BAND -->
  <section style="position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;">
    <div style="position:absolute;inset:0;"><image-slot id="about-hero" shape="rect" src="images/courts-sava.png" placeholder="Wide photo of the courts by the Sava river"></image-slot></div>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,32,20,.8),rgba(12,32,20,.25));pointer-events:none;"></div>
    <div style="position:relative;height:100%;max-width:1200px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;justify-content:center;pointer-events:none;">
      <div style="font-family:Oswald;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--ball);margin-bottom:12px;">{{ t.about_kicker }}</div>
      <h1 style="font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:clamp(30px,5vw,58px);line-height:1;color:#fff;margin:0 0 20px;max-width:760px;">{{ t.about_title }}</h1>
      <p style="color:#e3e9dc;font-size:clamp(16px,1.8vw,20px);line-height:1.6;color:#e3e9dc;max-width:620px;margin:0 0 18px;text-shadow:0 1px 12px rgba(0,0,0,.4);">{{ t.about_body }}</p>
      <p style="color:#d5ddce;font-size:clamp(15px,1.6vw,18px);line-height:1.65;max-width:620px;margin:0 0 18px;text-shadow:0 1px 12px rgba(0,0,0,.4);">{{ story2 }}</p>
      <p style="color:#d5ddce;font-size:clamp(15px,1.6vw,18px);line-height:1.65;max-width:620px;margin:0;text-shadow:0 1px 12px rgba(0,0,0,.4);">{{ story3 }}</p>
    </div>
  </section>

  <!-- GALLERY -->
  <section style="max-width:1200px;margin:0 auto;padding:30px 24px 30px;">
    <h2 style="font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:clamp(22px,2.6vw,34px);margin:0 0 22px;">{{ galleryTitle }}</h2>
    <div class="tkz-gal" style="display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:230px;gap:14px;">
      <div style="grid-column:span 2;grid-row:span 2;border-radius:16px;overflow:hidden;position:relative;user-select:none;" ref="{{ setRef }}">
        <img src="images/gal-1-night.jpg" alt="{{ nightLabel }}" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;" />
        <img src="images/gal-1.jpg" alt="{{ dayLabel }}" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;clip-path:{{ dayClip }};" />
        <span style="position:absolute;top:14px;left:14px;font-family:Oswald;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:#fff;background:rgba(18,58,36,.55);padding:6px 12px;border-radius:999px;pointer-events:none;display:inline-flex;align-items:center;gap:6px;"><i class="ph-duotone ph-sun"></i>{{ dayLabel }}</span>
        <span style="position:absolute;top:14px;right:14px;font-family:Oswald;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:#fff;background:rgba(10,18,30,.6);padding:6px 12px;border-radius:999px;pointer-events:none;display:inline-flex;align-items:center;gap:6px;"><i class="ph-duotone ph-moon-stars"></i>{{ nightLabel }}</span>
        <div style="position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.5);pointer-events:none;left:{{ handleLeft }};">
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.4);display:grid;place-items:center;color:var(--green-dk);font-size:22px;cursor:ew-resize;pointer-events:auto;touch-action:none;" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerLeave="{{ onUp }}"><i class="ph-duotone ph-arrows-left-right"></i></div>
        </div>
      </div>
      <div style="border-radius:16px;overflow:hidden;"><image-slot id="gal-2" shape="rect" src="images/gal-2.jpg" placeholder="Café / clubhouse"></image-slot></div>
      <div style="border-radius:16px;overflow:hidden;"><image-slot id="gal-3" shape="rect" src="images/gal-3.jpg" placeholder="River view"></image-slot></div>
      <div style="border-radius:16px;overflow:hidden;"><image-slot id="gal-4" shape="rect" src="images/gal-4.jpg" placeholder="Net & clay detail"></image-slot></div>
      <div style="border-radius:16px;overflow:hidden;"><image-slot id="gal-5" shape="rect" src="images/gal-5.jpg" placeholder="Players on court"></image-slot></div>
      <div style="grid-column:span 2;border-radius:16px;overflow:hidden;"><image-slot id="gal-6" shape="rect" src="images/gal-6.jpg" placeholder="Sunset / night play under lights"></image-slot></div>
    </div>
  </section>

  <!-- AMENITIES -->
  <section style="max-width:1200px;margin:0 auto;padding:40px 24px 90px;">
    <h2 style="font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:clamp(22px,2.6vw,34px);margin:0 0 22px;">{{ t.amen_title }}</h2>
    <div class="tkz-amen" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
      <sc-for list="{{ amenities }}" as="a" hint-placeholder-count="9">
        <div style="display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(18,58,36,.1);border-radius:12px;padding:16px 18px;">
          <span style="width:44px;height:44px;flex:0 0 auto;border-radius:11px;background:rgba(31,107,58,.1);display:grid;place-items:center;color:var(--green);font-size:24px;"><i class="{{ a.icon }}"></i></span>
          <span style="font-size:15.5px;font-weight:600;">{{ a.label }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: "en", split: 50, dragging: false };
  componentDidMount() { this._boot(); this._onLang = () => this.setState({ lang: window.ClubStore.getLang() }); document.addEventListener("tkz-lang", this._onLang); }
  componentWillUnmount() { document.removeEventListener("tkz-lang", this._onLang); }
  _boot(t) { t = t || 0; if (!window.ClubStore) { if (t < 40) setTimeout(() => this._boot(t + 1), 50); return; } this.setState({ lang: window.ClubStore.getLang() }); }
  _pct(e) { if (!this._cont) return this.state.split; var r = this._cont.getBoundingClientRect(); return Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)); }
  renderVals() {
    var self = this, D = window.ClubData, lang = this.state.lang, T = (D && D.I18N[lang]) || {};
    var amenities = (D ? D.AMENITIES : []).map(function (a) { return { icon: "ph-duotone ph-" + a.icon, label: lang === "sr" ? a.sr : a.en }; });
    var pct = this.state.split;
    return { t: T, amenities: amenities,
      dayClip: "inset(0 " + (100 - pct) + "% 0 0)", handleLeft: pct + "%",
      dayLabel: lang === "sr" ? "Dan" : "Day", nightLabel: lang === "sr" ? "Noć" : "Night",
      setRef: function (el) { self._cont = el; },
      onDown: function (e) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} self._dragging = true; self.setState({ split: self._pct(e) }); },
      onMove: function (e) { if (self._dragging) self.setState({ split: self._pct(e) }); },
      onUp: function () { self._dragging = false; },
      galleryTitle: lang === "sr" ? "Teren u slikama" : "The club in pictures",
      story2: lang === "sr" ? "Dve šljake se svakog jutra valjaju i lininiraju pre prve rezervacije. Uz njih su kafić, tuševi i mala radnja gde možeš da kupiš loptice i odneseš reket na španovanje."
        : "Both clay courts are rolled and lined every morning before the first booking. Beside them are the café, the showers, and a small shop where you can buy balls and drop a racket off for stringing.",
      story3: lang === "sr" ? "Lige su zatvorenog tipa — igraju ih članovi kluba. Ovaj sajt je njihova live tabela, raspored i mesto gde se upisuju rezultati."
        : "The leagues are closed — played by club members. This site is their live table, their schedule, and where results get written down." };
  }
}
</script>
</body>
</html>
