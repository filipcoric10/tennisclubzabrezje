<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
  <script src="./clubData.js"></script>
  <script src="./count-up.js"></script>
  <script src="./tkz-anim.js"></script>
  <style>
    :root{ --ink:#20291f; --green:#1f6b3a; --green-dk:#123a24; --ball:#cddb46; --clay:#c0562a; --brown:#6e4a30; --cream:#f6f2e9; --muted:#6f675a; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--cream); color:var(--ink); font-family:"Source Sans 3",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    a{ color:var(--green); text-decoration:none; } a:hover{ color:var(--clay); }
    ::selection{ background:var(--ball); color:var(--ink); }
    :focus-visible{ outline:2px solid var(--clay); outline-offset:2px; }
    @media (max-width:880px){ .tkz-foot-grid{ grid-template-columns:1fr !important; } }
  </style>
</helmet>
<div>
  <dc-import name="Nav" active="reserve" hint-size="100%,72px"></dc-import>

  <section style="max-width:1200px;margin:0 auto;padding:44px 24px 10px;">
    <div style="font-family:Oswald;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--clay);margin-bottom:12px;">{{ t.nav_reserve }}</div>
    <h1 style="font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:clamp(32px,4.6vw,60px);line-height:1;margin:0 0 10px;">{{ t.reserve_title }}</h1>
    <p style="color:var(--muted);font-size:17px;margin:0 0 22px;">{{ t.reserve_sub }}</p>

    <div style="border-radius:12px;padding:14px 18px;font-size:14.5px;line-height:1.5;{{ bannerStyle }}">
      <i class="{{ bannerIcon }}" style="margin-right:8px;"></i>{{ bannerText }}
    </div>
  </section>

  <!-- DATE PICKER -->
  <section style="max-width:1200px;margin:0 auto;padding:20px 24px 0;">
    <div style="display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;">
      <sc-for list="{{ dates }}" as="d" hint-placeholder-count="7">
        <button onClick="{{ d.onClick }}" style="{{ d.style }}">
          <span style="font-family:Oswald;letter-spacing:.05em;text-transform:uppercase;font-size:11px;opacity:.85;">{{ d.dow }}</span>
          <span style="font-family:Oswald;font-weight:700;font-size:22px;line-height:1;margin-top:2px;">{{ d.day }}</span>
          <span style="font-size:11px;opacity:.85;margin-top:2px;">{{ d.mon }}</span>
        </button>
      </sc-for>
    </div>
  </section>

  <!-- GRID -->
  <section style="max-width:1200px;margin:0 auto;padding:22px 24px 90px;">
    <div style="background:#fff;border:1px solid rgba(18,58,36,.1);border-radius:16px;overflow:hidden;">
      <div style="display:grid;grid-template-columns:90px 1fr 1fr;background:var(--green-dk);color:#cddb46;font-family:Oswald;letter-spacing:.06em;text-transform:uppercase;font-size:13px;">
        <div style="padding:14px 16px;">Time</div>
        <div style="padding:14px 16px;border-left:1px solid rgba(255,255,255,.12);">{{ t.court }} 1</div>
        <div style="padding:14px 16px;border-left:1px solid rgba(255,255,255,.12);">{{ t.court }} 2</div>
      </div>
      <sc-for list="{{ rows }}" as="row" hint-placeholder-count="11">
        <div style="display:grid;grid-template-columns:90px 1fr 1fr;border-bottom:1px solid rgba(18,58,36,.07);">
          <div style="padding:14px 16px;font-family:Oswald;font-weight:600;font-size:15px;color:var(--green-dk);display:flex;align-items:center;">{{ row.time }}</div>
          <sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="2">
            <div style="padding:10px 14px;border-left:1px solid rgba(18,58,36,.07);display:flex;align-items:center;">
              <sc-if value="{{ c.available }}" hint-placeholder-val="{{ true }}">
                <button onClick="{{ c.onBook }}" style="{{ c.bookStyle }}"><i class="ph-duotone ph-plus"></i> {{ bookLabel }}</button>
              </sc-if>
              <sc-if value="{{ c.booked }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;gap:8px;width:100%;background:{{ c.tint }};border-radius:9px;padding:8px 12px;">
                  <span style="width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:{{ c.avatarBg }};color:#fff;display:grid;place-items:center;font-family:Oswald;font-size:11px;">{{ c.initials }}</span>
                  <span style="font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ c.name }}</span>
                  <sc-if value="{{ c.canCancel }}" hint-placeholder-val="{{ false }}">
                    <button onClick="{{ c.onCancel }}" title="Cancel" style="background:none;border:none;cursor:pointer;color:var(--clay);font-size:18px;line-height:1;padding:2px;"><i class="ph-duotone ph-x-circle"></i></button>
                  </sc-if>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <p style="font-size:13px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:rgba(31,107,58,.15);border:1px solid rgba(31,107,58,.4);"></span>{{ t.available }}</span>
      <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:rgba(192,86,42,.18);"></span>{{ t.booked }}</span>
    </p>
  </section>

  <dc-import name="Footer" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: "en", session: null, date: null, ready: false };
  TIMES = ["08:00","09:30","11:00","12:30","14:00","15:30","17:00","18:30","20:00","21:30","23:00"];

  componentDidMount() {
    var d = new Date(); this.setState({ date: d.toISOString().slice(0, 10) });
    this._boot();
    this._onLang = () => this.setState({ lang: window.ClubStore.getLang() });
    this._onAuth = () => this.setState({ session: window.ClubStore.session() });
    this._onRes = () => this.forceUpdate();
    document.addEventListener("tkz-lang", this._onLang);
    document.addEventListener("tkz-auth", this._onAuth);
    document.addEventListener("tkz-reservations", this._onRes);
  }
  componentWillUnmount() {
    document.removeEventListener("tkz-lang", this._onLang);
    document.removeEventListener("tkz-auth", this._onAuth);
    document.removeEventListener("tkz-reservations", this._onRes);
  }
  _boot(t) { t = t || 0; if (!window.ClubStore) { if (t < 40) setTimeout(() => this._boot(t + 1), 50); return; }
    this.setState({ ready: true, lang: window.ClubStore.getLang(), session: window.ClubStore.session() }); }

  renderVals() {
    var self = this, D = window.ClubData, S = window.ClubStore, lang = this.state.lang;
    var T = (D && D.I18N[lang]) || {};
    if (!D) return { t: T, dates: [], rows: [] };
    var session = this.state.session, canBook = !!session;
    var loc = lang === "sr" ? "sr-Latn-RS" : "en-GB";

    // date pills — 7 days from today
    var base = this.state.date ? new Date(this.state.date + "T00:00:00") : new Date();
    var dates = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(base.getTime() + i * 86400000);
      var iso = d.toISOString().slice(0, 10);
      var on = iso === self.state.date;
      dates.push({ iso: iso,
        dow: d.toLocaleDateString(loc, { weekday: "short" }),
        day: d.getDate(), mon: d.toLocaleDateString(loc, { month: "short" }),
        style: "flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:11px 8px;border-radius:12px;cursor:pointer;border:1.5px solid " +
          (on ? "#1f6b3a" : "rgba(18,58,36,.18)") + ";background:" + (on ? "#1f6b3a" : "#fff") + ";color:" + (on ? "#fff" : "#20291f") + ";",
        onClick: function (iso) { return function () { self.setState({ date: iso }); }; }(iso) });
    }

    function initials(n) { return n.split(" ").map(function (w) { return w[0]; }).slice(0, 2).join(""); }

    var rows = this.TIMES.map(function (time) {
      var cells = [1, 2].map(function (court) {
        var res = S.reservationAt(court, self.state.date, time);
        if (res) {
          var mine = session && res.email && session.email && res.email.toLowerCase() === session.email.toLowerCase();
          return { available: false, booked: true, name: res.name || res.email,
            initials: initials(res.name || res.email), avatarBg: mine ? "#1f6b3a" : "#6e4a30",
            tint: mine ? "rgba(31,107,58,.12)" : "rgba(110,74,48,.1)",
            canCancel: !!(mine || (session && session.isAdmin)),
            onCancel: function () { if (confirm("Cancel this booking?")) S.cancelReservation(res.id); } };
        }
        return { available: true, booked: false,
          bookStyle: "width:100%;font-family:Oswald;letter-spacing:.04em;text-transform:uppercase;font-size:13px;padding:9px 10px;border-radius:9px;cursor:" +
            (canBook ? "pointer" : "not-allowed") + ";border:1.5px dashed " + (canBook ? "rgba(31,107,58,.45)" : "rgba(18,58,36,.2)") +
            ";background:" + (canBook ? "rgba(31,107,58,.06)" : "transparent") + ";color:" + (canBook ? "#1f6b3a" : "#a49b8c") + ";",
          onBook: function () {
            if (!canBook) return;
            S.addReservation(court, self.state.date, time, session.name, session.email);
          } };
      });
      return { time: time, cells: cells };
    });

    var bannerStyle, bannerText, bannerIcon;
    if (canBook) {
      bannerStyle = "background:rgba(31,107,58,.1);color:#155a30;border:1px solid rgba(31,107,58,.25);";
      bannerText = (T.welcome_back + ", " + session.name + " — ") + (lang === "sr" ? "izaberi slobodan termin da zakažeš." : "pick a free slot to book it.");
      bannerIcon = "ph-duotone ph-check-circle";
    } else {
      bannerStyle = "background:rgba(110,74,48,.1);color:#5c4a38;border:1px solid rgba(110,74,48,.2);";
      bannerText = (lang === "sr" ? "Prijavi se kao član da zakažeš termin. Gosti mogu da vide raspored." : "Log in as a member to book a slot. Guests can view the schedule.");
      bannerIcon = "ph-duotone ph-lock-simple";
    }

    return { t: T, dates: dates, rows: rows,
      bookLabel: T.book, bannerStyle: bannerStyle, bannerText: bannerText, bannerIcon: bannerIcon };
  }
}
</script>
</body>
</html>
